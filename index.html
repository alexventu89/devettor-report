<title>Meta e vendite De Vettor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
:root{--bg:#F6F5F3;--surface:#FCFCFC;--surface-2:#EFEDEA;--ink:#111111;--ink-2:#55524C;--muted:#6E6961;--line:#E2DFDA;--grid:#E9E6E1;--baseline:#C9C5BE;--accent:#CCA754;--meta:#6f4fc0;--vendite:#a8812a;--track:#EFEDEA;--focus:#7D611E;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0A0A0A;--surface:#141414;--surface-2:#1C1C1B;--ink:#FCFCFC;--ink-2:#BDB9B2;--muted:#8F8B84;--line:#2A2927;--grid:#232221;--baseline:#4A4843;--accent:#CCA754;--meta:#8f72dc;--vendite:#b08a36;--track:#1C1C1B;--focus:#CCA754;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0A0A0A;--surface:#141414;--surface-2:#1C1C1B;--ink:#FCFCFC;--ink-2:#BDB9B2;--muted:#8F8B84;--line:#2A2927;--grid:#232221;--baseline:#4A4843;--accent:#CCA754;--meta:#8f72dc;--vendite:#b08a36;--track:#1C1C1B;--focus:#CCA754;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Lato,"Helvetica Neue",Arial,sans-serif;padding-inline:16px}
main{max-width:420px;margin:0 auto;padding-block:12vh 40px;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--accent)}
.logo{width:64px;height:44px;flex:none;background:var(--ink);mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.15;text-wrap:balance}
form{display:flex;flex-direction:column;gap:14px}
label{font-weight:700}
input[type=password]{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--baseline);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.ricorda{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--ink-2)}
button{font:inherit;font-weight:900;font-size:17px;padding:13px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer;min-height:48px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin:0;color:var(--ink)}
.msg.errore{font-weight:700}
.msg.errore::before{content:"✕ ";color:var(--accent)}
footer{color:var(--muted);font-size:14px}
</style></head><body>
